name: Build Klarnet APK

on:
  push:
    branches:
      - claude/clarinet-sound-app-kIW8X
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          # GitHub Actions ubuntu-latest has Android SDK pre-installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Available platforms:"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || true
          echo "Available build-tools:"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || true
          # Install required components
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Klarnet-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Klarnet APK v1.0.${{ github.run_number }}"
          body: |
            ## Klarnet Sesi Çalıcı — Android 11+

            Düğmelere basınca klarnet sesi çıkar. 12 nota: Do–Sol (C4–G5).

            **Kurulum:** APK'yı indir → Bilinmeyen kaynaklar izni ver → Yükle
          files: app/build/outputs/apk/release/app-release.apk
