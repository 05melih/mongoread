name: Build Klarnet APK

on:
  push:
    branches:
      - claude/clarinet-sound-app-kIW8X
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klarnet-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Klarnet v1.0.${{ github.run_number }}"
          body: |
            ## Klarnet Sesi Çalıcı - Android 11+

            12 nota butonu: Do Re Mi Fa Sol La Si (C4-G5 arası)

            ### Kurulum
            1. `app-release.apk` dosyasını telefona indirin
            2. Ayarlar > Güvenlik > Bilinmeyen kaynaklar: Açık
            3. APK'ya tıklayıp yükleyin
          files: app/build/outputs/apk/release/app-release.apk
